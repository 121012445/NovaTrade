name: release

# 推送形如 v1.3.0 的 tag 时：在 Windows / macOS / Linux 上分别打包，上传到同一个 GitHub Release，全部成功后再正式发布。
# 应用内的自动更新（electron-updater）读取的就是这里发布的 latest*.yml 与安装包。
#
# 发版步骤：
#   1. 修改 package.json 的 version（例如 1.3.0）并提交
#   2. git tag v1.3.0 && git push origin v1.3.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Check tag matches package.json version
        run: |
          VER=$(node -p "require('./package.json').version")
          if [ "v$VER" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 package.json 的 version $VER 不一致"; exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --draft --title "NovaTrade ${GITHUB_REF_NAME}" --notes "自动构建。安装包见下方 Assets。"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build and upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 没有代码签名证书：跳过签名（macOS 未签名版本无法自动更新，只会提示有新版本）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.target }} --publish always

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
