<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>NovaTrade Widget</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;background:transparent;color:#fff;width:240px;height:100vh;overflow:hidden;user-select:none}
.wb{background:rgba(10,10,15,0.96);border:1px solid rgba(42,42,58,0.9);border-radius:16px;margin:8px;padding:10px 12px;width:224px;height:calc(100vh - 16px);display:flex;flex-direction:column;overflow:hidden}
.wh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid rgba(42,42,58,0.6);flex-shrink:0}
.wdrag{flex:1;-webkit-app-region:drag;height:20px}
.wt{font-size:11px;font-weight:700;color:#6366f1}
.wts{font-size:8px;color:#4a4a5a}
.wctrl{display:flex;gap:2px}
.wbtn{width:18px;height:18px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.06);border:1px solid rgba(42,42,58,0.5);color:#6a6a7a;border-radius:4px;cursor:pointer;font-size:9px;transition:all 0.15s}
.wbtn:hover{background:rgba(99,102,241,0.2);color:#6366f1;border-color:rgba(99,102,241,0.4)}
.wbtn.close:hover{background:rgba(239,68,68,0.2);color:#ef4444;border-color:rgba(239,68,68,0.4)}
.ws{margin-bottom:4px;flex:1;display:flex;flex-direction:column;min-height:0}
.wttl{font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:3px;flex-shrink:0}
.bull{color:#10b981}.bear{color:#ef4444}
.wcard{background:rgba(22,22,31,0.9);border:1px solid rgba(42,42,58,0.5);border-radius:5px;padding:4px 7px;margin-bottom:2px;cursor:pointer;transition:all 0.15s;flex-shrink:0}
.wcard:hover{border-color:rgba(99,102,241,0.5);background:rgba(30,30,42,0.9);transform:translateX(2px)}
.wct{display:flex;justify-content:space-between;align-items:center}
.wsym{font-size:10px;font-weight:600;color:#fff}
.wbadge{font-size:7px;font-weight:700;padding:1px 4px;border-radius:3px}
.bbuy{background:rgba(16,185,129,0.2);color:#10b981}.bsell{background:rgba(239,68,68,0.2);color:#ef4444}
.wcb{display:flex;justify-content:space-between;align-items:center;margin-top:1px}
.wprice{font-size:9px;color:#888}
.wchg{font-size:9px;font-weight:600}.cup{color:#10b981}.cdown{color:#ef4444}
.wemp{text-align:center;padding:8px 0;color:#3a3a4a;font-size:9px}
.wfoot{text-align:center;font-size:7px;color:#2a2a3a;padding-top:4px;border-top:1px solid rgba(42,42,58,0.4);flex-shrink:0}
.wscroll{overflow-y:auto;flex:1;min-height:0}
.wscroll::-webkit-scrollbar{width:2px}
.wscroll::-webkit-scrollbar-track{background:transparent}
.wscroll::-webkit-scrollbar-thumb{background:rgba(99,102,241,0.3);border-radius:1px}
</style>
</head>
<body>
<div class="wb" id="widgetBox">
  <div class="wh">
    <span class="wt">⚡ NovaTrade</span>
    <div class="wdrag"></div>
    <span class="wts" id="wts">--:--</span>
    <div class="wctrl">
      <button class="wbtn max" id="maxBtn">⛶</button>
      <button class="wbtn" id="pinBtn">📌</button>
      <button class="wbtn close" id="closeBtn">✕</button>
    </div>
  </div>
  <div class="ws">
    <div class="wttl bull">📈 看涨推荐</div>
    <div class="wscroll" id="bullList"><div class="wemp">等待主窗口数据...</div></div>
  </div>
  <div class="ws">
    <div class="wttl bear">📉 看跌预警</div>
    <div class="wscroll" id="bearList"><div class="wemp">等待主窗口数据...</div></div>
  </div>
  <div class="wfoot" id="wfoot">等待主窗口推送</div>
</div>
<script>
window.onerror=function(m,u,l){console.error("[widget-err]",m,u,l);};
console.log("[widget] Loaded");

var pinned=false, bigMode=false;

function fmtPrice(p){if(!p)return'--';var n=parseFloat(p);if(n>=1000)return n.toFixed(2);if(n>=1)return n.toFixed(4);if(n>=0.01)return n.toFixed(6);return n.toFixed(8);}

// 信号门槛统一口径：与主界面 index.html 的 SIGNAL_LONG_MIN / SIGNAL_SHORT_MAX 保持一致（65/45）
var SIGNAL_LONG_MIN=65, SIGNAL_SHORT_MAX=45;

function escHtml(v){
  if(v===null||v===undefined)return'';
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function renderCard(c,type){
  var up=c.change>=0;
  // 档位阈值与主界面 deriveLevels() 严格保持一致（5 档：70/65/45/30，门槛常量见顶部）
  var rec=c.rec || (c.score>=70?'强烈买入':c.score>=SIGNAL_LONG_MIN?'买入':c.score>=SIGNAL_SHORT_MAX?'持有':c.score>=30?'卖出':'强烈卖出');
  var bc=type==='buy'?'bbuy':'bsell';
  return '<div class="wcard" data-symbol="'+escHtml(c.symbol)+'">'+
    '<div class="wct"><span class="wsym">'+escHtml(c.symbol)+'</span><span class="wbadge '+bc+'">'+escHtml(rec)+'</span></div>'+
    '<div class="wcb"><span class="wprice">$'+fmtPrice(c.price)+'</span><span class="wchg '+(up?'cup':'cdown')+'">'+(up?'+':'')+c.change.toFixed(2)+'%</span></div>'+
    '</div>';
}

function updateWidget(data){
  var now=new Date();
  document.getElementById('wts').textContent=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  if(!data||!data.coins||data.coins.length===0){
    document.getElementById('bullList').innerHTML='<div class="wemp">暂无信号</div>';
    document.getElementById('bearList').innerHTML='<div class="wemp">暂无信号</div>';
    document.getElementById('wfoot').textContent='暂无数据';
    return;
  }
  var buys=data.coins.filter(function(c){return c.score>=SIGNAL_LONG_MIN;}).sort(function(a,b){return b.score-a.score;}).slice(0,bigMode?12:6);
  var sells=data.coins.filter(function(c){return c.score<SIGNAL_SHORT_MAX;}).sort(function(a,b){return a.score-b.score;}).slice(0,bigMode?12:6);
  console.log('[widget] Renders:', buys.length, 'buys,', sells.length, 'sells');
  document.getElementById('bullList').innerHTML=buys.length>0?buys.map(function(c){return renderCard(c,'buy');}).join(''):'<div class="wemp">暂无</div>';
  document.getElementById('bearList').innerHTML=sells.length>0?sells.map(function(c){return renderCard(c,'sell');}).join(''):'<div class="wemp">暂无</div>';
  document.getElementById('wfoot').textContent='共'+(data.total!=null?data.total:data.coins.length)+'个已分析';
}

document.getElementById('maxBtn').addEventListener('click',function(e){
  e.preventDefault();e.stopPropagation();
  bigMode=!bigMode;
  this.title=bigMode?'缩小':'放大';
  if(window.electronAPI&&window.electronAPI.resizeWidget) window.electronAPI.resizeWidget(bigMode?260:240,bigMode?520:320);
});
document.getElementById('pinBtn').addEventListener('click',function(e){
  e.preventDefault();e.stopPropagation();
  pinned=!pinned;
  this.style.opacity=pinned?'1':'0.4';
  this.style.background=pinned?'rgba(99,102,241,0.2)':'';
  if(window.electronAPI&&window.electronAPI.setWidgetAlwaysOnTop) window.electronAPI.setWidgetAlwaysOnTop(pinned);
});
document.getElementById('closeBtn').addEventListener('click',function(e){
  e.preventDefault();e.stopPropagation();
  if(window.electronAPI) window.electronAPI.closeWidget();
});

document.getElementById('bullList').addEventListener('click',function(e){
  var card=e.target.closest('.wcard');
  if(card){
    e.preventDefault();e.stopPropagation();
    console.log('[widget] Card clicked:',card.getAttribute('data-symbol'));
    if(window.electronAPI) window.electronAPI.showMain();
  }
});
document.getElementById('bearList').addEventListener('click',function(e){
  var card=e.target.closest('.wcard');
  if(card){
    e.preventDefault();e.stopPropagation();
    console.log('[widget] Card clicked:',card.getAttribute('data-symbol'));
    if(window.electronAPI) window.electronAPI.showMain();
  }
});

if(window.electronAPI&&window.electronAPI.onWidgetUpdate){
  window.electronAPI.onWidgetUpdate(function(data){
    console.log('[widget] IPC data received, coins:', data.coins?data.coins.length:0);
    updateWidget(data);
  });
  console.log('[widget] IPC listener registered');
}else{
  console.error('[widget] electronAPI not available');
}
</script>
</body>
</html>
